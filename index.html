<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti, Mi Amor 🌻</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #fffef0 0%, #fef3c7 50%, #fde68a 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 15px 10px;
      position: relative;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }

    .main-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }

    /* Contenedor del Ramo Grande */
    .bouquet-box {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 560px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bouquet-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 25px rgba(217, 119, 6, 0.22));
      animation: gentleFloat 4s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0) rotate(-1deg); }
      100% { transform: translateY(-8px) rotate(1deg); }
    }

    /* Tarjeta incrustada sobre el ramo */
    .card-trigger {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      background: rgba(255, 255, 255, 0.95);
      border: 2px dashed #f59e0b;
      padding: 14px 12px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(180, 83, 9, 0.3);
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: pulseBtn 2.2s infinite;
    }

    .card-trigger:hover, .card-trigger:active {
      transform: translate(-50%, -55%) scale(1.05);
    }

    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 10px 22px rgba(245, 158, 11, 0.25); }
      50% { box-shadow: 0 16px 36px rgba(245, 158, 11, 0.55); }
    }

    .card-trigger .icon {
      font-size: 24px;
      display: block;
      margin-bottom: 2px;
    }

    .card-trigger .title {
      font-family: 'Caveat', cursive;
      font-size: 1.65rem;
      color: #b45309;
      font-weight: 700;
      line-height: 1.1;
    }

    .card-trigger .hint {
      font-size: 0.78rem;
      color: #92400e;
      display: block;
      margin-top: 4px;
      font-weight: 500;
    }

    /* Ventana emergente (Modal) con la carta y la foto */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: #fffdfa;
      width: 100%;
      max-width: 390px;
      border-radius: 26px;
      padding: 26px 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      border: 2px solid #fef08a;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 26px;
      color: #9ca3af;
      cursor: pointer;
    }

    .photo-frame {
      width: 145px;
      height: 145px;
      margin: 6px auto 14px;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #f59e0b;
      box-shadow: 0 10px 22px rgba(245, 158, 11, 0.35);
    }

    .photo-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      font-size: 30px;
    }

    .modal-heading {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #b45309;
      margin-bottom: 6px;
    }

    .letter-box {
      background: #ffffff;
      padding: 16px 18px;
      border-radius: 16px;
      border-left: 4px solid #f59e0b;
      color: #4b5563;
      font-size: 0.92rem;
      line-height: 1.65;
      text-align: left;
      margin: 14px 0 18px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    }

    .btn-close-action {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(217, 119, 6, 0.3);
    }
  </style>
</head>
<body>

  <!-- Lluvia de pétalos amarillos -->
  <canvas id="petalsCanvas"></canvas>

  <div class="main-wrap">
    <div class="bouquet-box">
      <!-- Ramo Grande Ilustrado en SVG -->
      <svg class="bouquet-svg" viewBox="0 0 500 700">
        <defs>
          <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#708d57"/>
            <stop offset="100%" stop-color="#40592e"/>
          </linearGradient>
          <linearGradient id="petalY1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff07c"/>
            <stop offset="60%" stop-color="#fbc02d"/>
            <stop offset="100%" stop-color="#f57f17"/>
          </linearGradient>
          <linearGradient id="petalY2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffee58"/>
            <stop offset="70%" stop-color="#fdd835"/>
            <stop offset="100%" stop-color="#e65100"/>
          </linearGradient>
          <radialGradient id="centerBrown">
            <stop offset="0%" stop-color="#d7ccc8"/>
            <stop offset="45%" stop-color="#8d6e63"/>
            <stop offset="85%" stop-color="#5d4037"/>
            <stop offset="100%" stop-color="#3e2723"/>
          </radialGradient>
          <linearGradient id="ribbonGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe082"/>
            <stop offset="40%" stop-color="#ffb300"/>
            <stop offset="100%" stop-color="#ff8f00"/>
          </linearGradient>

          <!-- Modelo de flor individual de 16 pétalos -->
          <g id="flower-unit">
            <g>
              <ellipse cx="0" cy="-55" rx="14" ry="42" fill="url(#petalY1)"/>
              <ellipse cx="0" cy="55" rx="14" ry="42" fill="url(#petalY1)"/>
              <ellipse cx="-55" cy="0" rx="42" ry="14" fill="url(#petalY1)"/>
              <ellipse cx="55" cy="0" rx="42" ry="14" fill="url(#petalY1)"/>
              <ellipse cx="-38" cy="-38" rx="14" ry="42" transform="rotate(-45 -38 -38)" fill="url(#petalY2)"/>
              <ellipse cx="38" cy="-38" rx="14" ry="42" transform="rotate(45 38 -38)" fill="url(#petalY2)"/>
              <ellipse cx="-38" cy="38" rx="14" ry="42" transform="rotate(45 -38 38)" fill="url(#petalY2)"/>
              <ellipse cx="38" cy="38" rx="14" ry="42" transform="rotate(-45 38 38)" fill="url(#petalY2)"/>
              <ellipse cx="-22" cy="-50" rx="12" ry="38" transform="rotate(-22.5 -22 -50)" fill="url(#petalY1)"/>
              <ellipse cx="22" cy="-50" rx="12" ry="38" transform="rotate(22.5 22 -50)" fill="url(#petalY1)"/>
              <ellipse cx="-50" cy="-22" rx="38" ry="12" transform="rotate(-22.5 -50 -22)" fill="url(#petalY1)"/>
              <ellipse cx="50" cy="-22" rx="38" ry="12" transform="rotate(22.5 50 -22)" fill="url(#petalY1)"/>
              <ellipse cx="-22" cy="50" rx="12" ry="38" transform="rotate(22.5 -22 50)" fill="url(#petalY2)"/>
              <ellipse cx="22" cy="50" rx="12" ry="38" transform="rotate(-22.5 22 50)" fill="url(#petalY2)"/>
              <ellipse cx="-50" cy="22" rx="38" ry="12" transform="rotate(22.5 -50 22)" fill="url(#petalY2)"/>
              <ellipse cx="50" cy="22" rx="38" ry="12" transform="rotate(-22.5 50 22)" fill="url(#petalY2)"/>
            </g>
            <circle cx="0" cy="0" r="28" fill="url(#centerBrown)" stroke="#ffe082" stroke-width="2" stroke-dasharray="2,3"/>
          </g>
        </defs>

        <!-- Tallos verdes del ramo -->
        <g stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round">
          <line x1="250" y1="350" x2="225" y2="580" />
          <line x1="240" y1="360" x2="245" y2="590" />
          <line x1="260" y1="350" x2="265" y2="585" />
          <line x1="250" y1="360" x2="285" y2="575" />
          <line x1="245" y1="370" x2="235" y2="565" />
          <line x1="255" y1="370" x2="275" y2="570" />
        </g>

        <!-- Hojas verdes de relleno -->
        <g fill="#557a46" opacity="0.85">
          <path d="M140,240 C110,210 100,160 120,130 C150,160 160,210 140,240 Z" />
          <path d="M360,240 C390,210 400,160 380,130 C350,160 340,210 360,240 Z" />
          <path d="M210,130 C190,90 220,50 250,40 C260,80 240,110 210,130 Z" />
          <path d="M290,130 C310,90 280,50 250,40 C240,80 260,110 290,130 Z" />
        </g>

        <!-- Cúpula frondosa de Flores Amarillas -->
        <use href="#flower-unit" x="250" y="110" transform="scale(0.85) translate(45, 18)" />
        <use href="#flower-unit" x="170" y="150" transform="scale(0.9) translate(18, 15)" />
        <use href="#flower-unit" x="330" y="150" transform="scale(0.9) translate(-36, 15)" />
        <use href="#flower-unit" x="120" y="230" transform="scale(0.8) translate(30, 57)" />
        <use href="#flower-unit" x="380" y="230" transform="scale(0.8) translate(-95, 57)" />
        <use href="#flower-unit" x="190" y="250" transform="scale(0.95) translate(10, 12)" />
        <use href="#flower-unit" x="310" y="250" transform="scale(0.95) translate(-32, 12)" />
        <use href="#flower-unit" x="250" y="200" transform="scale(1.05) translate(-12, -10)" />
        <use href="#flower-unit" x="160" y="320" transform="scale(0.85) translate(28, 56)" />
        <use href="#flower-unit" x="340" y="320" transform="scale(0.85) translate(-60, 56)" />

        <!-- Gran Lazo Amarillo Dorado -->
        <g id="ribbon">
          <!-- Lazadas caídas -->
          <path d="M235,465 Q180,520 160,600 Q200,580 230,490 Z" fill="url(#ribbonGold)" />
          <path d="M265,465 Q320,520 340,600 Q300,580 270,490 Z" fill="url(#ribbonGold)" />
          <!-- Orejas del moño -->
          <ellipse cx="205" cy="455" rx="35" ry="24" transform="rotate(-20 205 455)" fill="url(#ribbonGold)" stroke="#d97706" stroke-width="2"/>
          <ellipse cx="295" cy="455" rx="35" ry="24" transform="rotate(20 295 455)" fill="url(#ribbonGold)" stroke="#d97706" stroke-width="2"/>
          <!-- Nudo central -->
          <rect x="235" y="445" width="30" height="25" rx="7" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
        </g>
      </svg>

      <!-- Tarjeta en el centro del ramo -->
      <div class="card-trigger" onclick="openLetter()">
        <span class="icon">💌</span>
        <div class="title">Para Ti</div>
        <span class="hint">Toca para abrir la carta</span>
      </div>
    </div>
  </div>

  <!-- Modal con la Carta y la Foto -->
  <div class="modal-overlay" id="letterModal" onclick="closeOnBackdrop(event)">
    <div class="modal-content">
      <button class="close-btn" onclick="closeLetter()">×</button>
      
      <div class="photo-frame">
        <img src="foto.jpg" alt="Foto especial">
        <div class="photo-badge">🌻</div>
      </div>

      <div class="modal-heading">¡Feliz día de las flores amarillas!</div>

      <div class="letter-box">
        Hoy quise darte un ramo que nunca se marchita. Gracias por iluminar mis días con tu sonrisa y por ser la persona más increíble. Estas flores amarillas son solo un recordatorio de lo mucho que te amo. 💛
      </div>

      <button class="btn-close-action" onclick="closeLetter()">
        Guardar con amor 💛
      </button>
    </div>
  </div>

  <script>
    // Lluvia fluida de pétalos amarillos
    const canvas = document.getElementById('petalsCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const colors = ['#fde047', '#facc15', '#eab308', '#fef08a'];
    const petals = [];

    class Petal {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.size = Math.random() * 8 + 10;
        this.speedY = Math.random() * 1.5 + 1.2;
        this.speedX = Math.random() * 1.2 - 0.6;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 2;
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.rotation += this.rotationSpeed;
        if (this.y > height + 20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, 2 * Math.PI);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 35; i++) {
      const p = new Petal();
      p.y = Math.random() * height;
      petals.push(p);
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      petals.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // Modal de la Carta
    const modal = document.getElementById('letterModal');

    function openLetter() {
      modal.classList.add('active');
    }

    function closeLetter() {
      modal.classList.remove('active');
    }

    function closeOnBackdrop(e) {
      if (e.target === modal) {
        closeLetter();
      }
    }
  </script>
</body>
</html>
