<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti, Mi Amor 🌻</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 25%, #fffef0 0%, #fef3c7 45%, #fde68a 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 10px;
      position: relative;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }

    .main-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
    }

    /* Contenedor del Ramo Grande */
    .bouquet-box {
      position: relative;
      width: 100%;
      max-width: 460px;
      height: 640px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bouquet-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 18px 30px rgba(217, 119, 6, 0.25));
      animation: gentleFloat 4s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0) rotate(-1deg); }
      100% { transform: translateY(-8px) rotate(1deg); }
    }

    /* Tarjeta reposicionada más abajo sobre el ramo */
    .card-trigger {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 225px;
      background: rgba(255, 255, 255, 0.96);
      border: 2px dashed #f59e0b;
      padding: 13px 14px;
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(180, 83, 9, 0.32);
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: pulseBtn 2.2s infinite;
    }

    .card-trigger:hover, .card-trigger:active {
      transform: translate(-50%, -53%) scale(1.04);
    }

    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25); }
      50% { box-shadow: 0 16px 36px rgba(245, 158, 11, 0.55); }
    }

    .card-trigger .icon {
      font-size: 24px;
      display: block;
      margin-bottom: 2px;
    }

    .card-trigger .title {
      font-family: 'Caveat', cursive;
      font-size: 1.65rem;
      color: #b45309;
      font-weight: 700;
      line-height: 1.1;
    }

    .card-trigger .hint {
      font-size: 0.76rem;
      color: #92400e;
      display: block;
      margin-top: 3px;
      font-weight: 500;
    }

    /* Modal emergente con la carta y la foto */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: #fffdfa;
      width: 100%;
      max-width: 390px;
      border-radius: 26px;
      padding: 26px 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      border: 2px solid #fef08a;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 26px;
      color: #9ca3af;
      cursor: pointer;
    }

    .photo-frame {
      width: 145px;
      height: 145px;
      margin: 6px auto 14px;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #f59e0b;
      box-shadow: 0 10px 22px rgba(245, 158, 11, 0.35);
    }

    .photo-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      font-size: 30px;
    }

    .modal-heading {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #b45309;
      margin-bottom: 6px;
    }

    .letter-box {
      background: #ffffff;
      padding: 16px 18px;
      border-radius: 16px;
      border-left: 4px solid #f59e0b;
      color: #4b5563;
      font-size: 0.92rem;
      line-height: 1.65;
      text-align: left;
      margin: 14px 0 18px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    }

    .btn-close-action {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(217, 119, 6, 0.3);
    }

    /* Indicador discreto de música */
    .music-tag {
      margin-top: 5px;
      background: rgba(255, 255, 255, 0.85);
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    #ytPlayer {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Lluvia de pétalos amarillos -->
  <canvas id="petalsCanvas"></canvas>

  <!-- Contenedor oculto del audio de YouTube -->
  <div id="ytPlayer"></div>

  <div class="main-wrap">
    <div class="bouquet-box">
      <!-- Ramo Grande Vectorial SVG -->
      <svg class="bouquet-svg" viewBox="0 0 520 720">
        <defs>
          <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#708d57"/>
            <stop offset="100%" stop-color="#40592e"/>
          </linearGradient>
          <linearGradient id="petalY1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff59d"/>
            <stop offset="50%" stop-color="#fbc02d"/>
            <stop offset="100%" stop-color="#f57f17"/>
          </linearGradient>
          <linearGradient id="petalY2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff9c4"/>
            <stop offset="60%" stop-color="#fdd835"/>
            <stop offset="100%" stop-color="#e65100"/>
          </linearGradient>
          <radialGradient id="centerBrown">
            <stop offset="0%" stop-color="#d7ccc8"/>
            <stop offset="45%" stop-color="#8d6e63"/>
            <stop offset="85%" stop-color="#5d4037"/>
            <stop offset="100%" stop-color="#3e2723"/>
          </radialGradient>
          <linearGradient id="ribbonGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe082"/>
            <stop offset="40%" stop-color="#ffb300"/>
            <stop offset="100%" stop-color="#ff8f00"/>
          </linearGradient>

          <!-- Flor individual de 16 pétalos detallada -->
          <g id="flower-unit">
            <g>
              <ellipse cx="0" cy="-55" rx="14" ry="42" fill="url(#petalY1)"/>
              <ellipse cx="0" cy="55" rx="14" ry="42" fill="url(#petalY1)"/>
              <ellipse cx="-55" cy="0" rx="42" ry="14" fill="url(#petalY1)"/>
              <ellipse cx="55" cy="0" rx="42" ry="14" fill="url(#petalY1)"/>
              <ellipse cx="-38" cy="-38" rx="14" ry="42" transform="rotate(-45 -38 -38)" fill="url(#petalY2)"/>
              <ellipse cx="38" cy="-38" rx="14" ry="42" transform="rotate(45 38 -38)" fill="url(#petalY2)"/>
              <ellipse cx="-38" cy="38" rx="14" ry="42" transform="rotate(45 -38 38)" fill="url(#petalY2)"/>
              <ellipse cx="38" cy="38" rx="14" ry="42" transform="rotate(-45 38 38)" fill="url(#petalY2)"/>
              <ellipse cx="-22" cy="-50" rx="12" ry="38" transform="rotate(-22.5 -22 -50)" fill="url(#petalY1)"/>
              <ellipse cx="22" cy="-50" rx="12" ry="38" transform="rotate(22.5 22 -50)" fill="url(#petalY1)"/>
              <ellipse cx="-50" cy="-22" rx="38" ry="12" transform="rotate(-22.5 -50 -22)" fill="url(#petalY1)"/>
              <ellipse cx="50" cy="-22" rx="38" ry="12" transform="rotate(22.5 50 -22)" fill="url(#petalY1)"/>
              <ellipse cx="-22" cy="50" rx="12" ry="38" transform="rotate(22.5 -22 50)" fill="url(#petalY2)"/>
              <ellipse cx="22" cy="50" rx="12" ry="38" transform="rotate(22.5 22 50)" fill="url(#petalY2)"/>
              <ellipse cx="-50" cy="22" rx="38" ry="12" transform="rotate(22.5 -50 22)" fill="url(#petalY2)"/>
              <ellipse cx="50" cy="22" rx="38" ry="12" transform="rotate(-22.5 50 22)" fill="url(#petalY2)"/>
            </g>
            <circle cx="0" cy="0" r="28" fill="url(#centerBrown)" stroke="#ffe082" stroke-width="2" stroke-dasharray="2,3"/>
          </g>
        </defs>

        <!-- Tallos verdes estilizados -->
        <g stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round">
          <line x1="260" y1="420" x2="220" y2="670" />
          <line x1="250" y1="430" x2="245" y2="685" />
          <line x1="270" y1="420" x2="270" y2="680" />
          <line x1="255" y1="430" x2="295" y2="665" />
          <line x1="245" y1="440" x2="235" y2="655" />
          <line x1="265" y1="440" x2="280" y2="660" />
        </g>

        <!-- Hojas verdes grandes -->
        <g fill="#557a46" opacity="0.88">
          <path d="M130,220 C80,180 70,120 100,80 C140,120 150,180 130,220 Z" />
          <path d="M390,220 C440,180 450,120 420,80 C380,120 370,180 390,220 Z" />
          <path d="M200,100 C180,40 220,10 260,0 C270,45 240,85 200,100 Z" />
          <path d="M320,100 C340,40 300,10 260,0 C250,45 280,85 320,100 Z" />
          <path d="M100,320 C60,280 60,210 90,170 C120,210 120,280 100,320 Z" />
          <path d="M420,320 C460,280 460,210 430,170 C400,210 400,280 420,320 Z" />
        </g>

        <!-- Ramo Frondoso (13 Flores Amarillas organizadas) -->
        <use href="#flower-unit" x="260" y="85" transform="scale(1.05) translate(-12, -5)" />
        <use href="#flower-unit" x="175" y="125" transform="scale(1) translate(0, 0)" />
        <use href="#flower-unit" x="345" y="125" transform="scale(1) translate(0, 0)" />
        <use href="#flower-unit" x="105" y="195" transform="scale(0.92) translate(10, 15)" />
        <use href="#flower-unit" x="415" y="195" transform="scale(0.92) translate(-35, 15)" />
        
        <use href="#flower-unit" x="200" y="210" transform="scale(1.1) translate(-15, -15)" />
        <use href="#flower-unit" x="320" y="210" transform="scale(1.1) translate(-25, -15)" />
        <use href="#flower-unit" x="260" y="180" transform="scale(1.15) translate(-32, -22)" />

        <use href="#flower-unit" x="140" y="300" transform="scale(1.02) translate(-3, 0)" />
        <use href="#flower-unit" x="380" y="300" transform="scale(1.02) translate(-35, 0)" />
        <use href="#flower-unit" x="210" y="315" transform="scale(1.05) translate(-10, 0)" />
        <use href="#flower-unit" x="310" y="315" transform="scale(1.05) translate(-25, 0)" />
        <use href="#flower-unit" x="260" y="290" transform="scale(1.08) translate(-18, -10)" />

        <!-- Gran Lazo Amarillo Dorado -->
        <g id="ribbon">
          <path d="M235,530 Q160,600 135,680 Q190,660 230,560 Z" fill="url(#ribbonGold)" />
          <path d="M285,530 Q360,600 385,680 Q330,660 290,560 Z" fill="url(#ribbonGold)" />
          <ellipse cx="205" cy="520" rx="42" ry="28" transform="rotate(-20 205 520)" fill="url(#ribbonGold)" stroke="#d97706" stroke-width="2"/>
          <ellipse cx="315" cy="520" rx="42" ry="28" transform="rotate(20 315 520)" fill="url(#ribbonGold)" stroke="#d97706" stroke-width="2"/>
          <rect x="242" y="508" width="36" height="28" rx="8" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
        </g>
      </svg>

      <!-- Tarjeta posicionada más abajo para no tapar las flores principales -->
      <div class="card-trigger" onclick="openLetter()">
        <span class="icon">💌</span>
        <div class="title">Para Ti</div>
        <span class="hint">Toca para abrir la carta</span>
      </div>
    </div>

    <!-- Indicador de música -->
    <div class="music-tag" onclick="toggleAudio()">
      <span>🎵</span> <span id="musicStatus">Una Lady Como Tú</span>
    </div>
  </div>

  <!-- Modal con la Carta y la Foto -->
  <div class="modal-overlay" id="letterModal" onclick="closeOnBackdrop(event)">
    <div class="modal-content">
      <button class="close-btn" onclick="closeLetter()">×</button>
      
      <div class="photo-frame">
        <img src="foto.jpg" alt="Foto especial">
        <div class="photo-badge">🌻</div>
      </div>

      <div class="modal-heading">¡Feliz día de las flores amarillas!</div>

      <div class="letter-box">
        Hoy quise darte un ramo que nunca se marchita. Gracias por iluminar mis días con tu sonrisa y por ser la persona más increíble. Estas flores amarillas son solo un recordatorio de lo mucho que te amo. 💛
      </div>

      <button class="btn-close-action" onclick="closeLetter()">
        Guardar con amor 💛
      </button>
    </div>
  </div>

  <script>
    // 1. ANIMACIÓN DE PÉTALOS EN CANVAS
    const canvas = document.getElementById('petalsCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const colors = ['#fde047', '#facc15', '#eab308', '#fef08a'];
    const petals = [];

    class Petal {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.size = Math.random() * 8 + 10;
        this.speedY = Math.random() * 1.5 + 1.2;
        this.speedX = Math.random() * 1.2 - 0.6;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 2;
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.rotation += this.rotationSpeed;
        if (this.y > height + 20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, 2 * Math.PI);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 35; i++) {
      const p = new Petal();
      p.y = Math.random() * height;
      petals.push(p);
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      petals.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // 2. CONTROL DE AUDIO VÍA YOUTUBE (Manuel Turizo - Una Lady Como Tú)
    let player;
    let isPlaying = false;
    const musicStatus = document.getElementById('musicStatus');
    const modal = document.getElementById('letterModal');

    // Cargar la API de YouTube
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytPlayer', {
        height: '0',
        width: '0',
        videoId: 'VYtJAuoZxcc',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'loop': 1,
          'playlist': 'VYtJAuoZxcc'
        }
      });
    }

    function playMusic() {
      if (player && typeof player.playVideo === 'function') {
        player.playVideo();
        isPlaying = true;
        if (musicStatus) musicStatus.textContent = 'Pausar canción ⏸️';
      }
    }

    function pauseMusic() {
      if (player && typeof player.pauseVideo === 'function') {
        player.pauseVideo();
        isPlaying = false;
        if (musicStatus) musicStatus.textContent = 'Una Lady Como Tú ▶️';
      }
    }

    function toggleAudio() {
      if (!isPlaying) {
        playMusic();
      } else {
        pauseMusic();
      }
    }

    // Modal de la Carta
    function openLetter() {
      modal.classList.add('active');
      playMusic();
    }

    function closeLetter() {
      modal.classList.remove('active');
    }

    function closeOnBackdrop(e) {
      if (e.target === modal) {
        closeLetter();
      }
    }

    // Desbloqueo directo al primer toque en cualquier parte de la pantalla
    document.addEventListener('click', () => { if (!isPlaying) playMusic(); }, { once: true });
    document.addEventListener('touchstart', () => { if (!isPlaying) playMusic(); }, { once: true });
  </script>
</body>
</html>
