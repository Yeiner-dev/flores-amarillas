<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti, Mi Amor 🌻</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 25%, #fffdf2 0%, #fef3c7 45%, #fde68a 100%);
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 15px 10px;
      position: relative;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }

    .main-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
    }

    /* Contenedor del Ramo */
    .bouquet-box {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Vuelve el fondo negro 100% transparente */
    .bouquet-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: drop-shadow(0 15px 25px rgba(217, 119, 6, 0.28));
      animation: gentleSway 4.5s ease-in-out infinite alternate;
    }

    @keyframes gentleSway {
      0% { transform: rotate(-1.5deg) scale(0.99); }
      100% { transform: rotate(1.5deg) scale(1.02); }
    }

    /* Tarjeta reposicionada abajo en los tallos/lazo */
    .card-trigger {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      background: rgba(255, 255, 255, 0.95);
      border: 2px dashed #f59e0b;
      padding: 12px 14px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(180, 83, 9, 0.3);
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: pulseBtn 2.4s infinite;
      z-index: 5;
    }

    .card-trigger:hover, .card-trigger:active {
      transform: translateX(-50%) translateY(-5px) scale(1.04);
    }

    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25); }
      50% { box-shadow: 0 14px 30px rgba(245, 158, 11, 0.5); }
    }

    .card-trigger .icon {
      font-size: 22px;
      display: block;
      margin-bottom: 2px;
    }

    .card-trigger .title {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: #b45309;
      font-weight: 700;
      line-height: 1.1;
    }

    .card-trigger .hint {
      font-size: 0.76rem;
      color: #92400e;
      display: block;
      margin-top: 3px;
      font-weight: 500;
    }

    /* Modal emergente con la carta y la foto */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: #fffdfa;
      width: 100%;
      max-width: 385px;
      border-radius: 26px;
      padding: 26px 20px;
      text-align: center;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
      border: 2px solid #fef08a;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 26px;
      color: #9ca3af;
      cursor: pointer;
    }

    .photo-frame {
      width: 145px;
      height: 145px;
      margin: 6px auto 14px;
      position: relative;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #f59e0b;
      box-shadow: 0 10px 22px rgba(245, 158, 11, 0.35);
    }

    .photo-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      font-size: 30px;
    }

    .modal-heading {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #b45309;
      margin-bottom: 6px;
    }

    .letter-box {
      background: #ffffff;
      padding: 16px 18px;
      border-radius: 16px;
      border-left: 4px solid #f59e0b;
      color: #4b5563;
      font-size: 0.92rem;
      line-height: 1.65;
      text-align: left;
      margin: 14px 0 18px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
    }

    .btn-close-action {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(217, 119, 6, 0.3);
    }

    /* Botón de música */
    .music-tag {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.9);
      color: #92400e;
      border: 1px solid #fde68a;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    #ytPlayer {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Lluvia de pétalos amarillos -->
  <canvas id="petalsCanvas"></canvas>

  <!-- YouTube Audio invisible -->
  <div id="ytPlayer"></div>

  <div class="main-wrap">
    <div class="bouquet-box">
      <!-- Ramo con blend mode para fondo transparente -->
      <img src="ramo.jpg" alt="Ramo de Flores Amarillas" class="bouquet-img">

      <!-- Tarjeta posicionada en la base del ramo -->
      <div class="card-trigger" onclick="openLetter()">
        <span class="icon">💌</span>
        <div class="title">Para Ti</div>
        <span class="hint">Toca para abrir la carta</span>
      </div>
    </div>

    <!-- Indicador de música -->
    <div class="music-tag" onclick="toggleAudio()">
      <span>🎵</span> <span id="musicStatus">Una Lady Como Tú ▶️</span>
    </div>
  </div>

  <!-- Modal con la Carta y la Foto -->
  <div class="modal-overlay" id="letterModal" onclick="closeOnBackdrop(event)">
    <div class="modal-content">
      <button class="close-btn" onclick="closeLetter()">×</button>
      
      <div class="photo-frame">
        <img src="foto.jpg" alt="Foto especial">
        <div class="photo-badge">🌻</div>
      </div>

      <div class="modal-heading">¡Feliz día de las flores amarillas!</div>

      <div class="letter-box">
        Hoy quise darte un ramo que nunca se marchita. Gracias por iluminar mis días con tu sonrisa y por ser la persona más increíble. Estas flores amarillas son solo un recordatorio de lo mucho que te amo. 💛
      </div>

      <button class="btn-close-action" onclick="closeLetter()">
        Guardar en el corazón 💛
      </button>
    </div>
  </div>

  <script>
    // 1. ANIMACIÓN DE PÉTALOS EN CANVAS
    const canvas = document.getElementById('petalsCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const colors = ['#fde047', '#facc15', '#eab308', '#fef08a'];
    const petals = [];

    class Petal {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.size = Math.random() * 8 + 10;
        this.speedY = Math.random() * 1.4 + 1.1;
        this.speedX = Math.random() * 1.2 - 0.6;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 2;
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.rotation += this.rotationSpeed;
        if (this.y > height + 20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, 2 * Math.PI);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 35; i++) {
      const p = new Petal();
      p.y = Math.random() * height;
      petals.push(p);
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      petals.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // 2. REPRODUCTOR DE YOUTUBE (Manuel Turizo - Una Lady Como Tú)
    let player;
    let isPlaying = false;
    const musicStatus = document.getElementById('musicStatus');
    const modal = document.getElementById('letterModal');

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytPlayer', {
        height: '0',
        width: '0',
        videoId: 'VYtJAuoZxcc',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'loop': 1,
          'playlist': 'VYtJAuoZxcc'
        }
      });
    }

    function playMusic() {
      if (player && typeof player.playVideo === 'function') {
        player.playVideo();
        isPlaying = true;
        if (musicStatus) musicStatus.textContent = 'Pausar canción ⏸️';
      }
    }

    function pauseMusic() {
      if (player && typeof player.pauseVideo === 'function') {
        player.pauseVideo();
        isPlaying = false;
        if (musicStatus) musicStatus.textContent = 'Una Lady Como Tú ▶️';
      }
    }

    function toggleAudio() {
      if (!isPlaying) {
        playMusic();
      } else {
        pauseMusic();
      }
    }

    // Modal de la Carta
    function openLetter() {
      modal.classList.add('active');
      playMusic();
    }

    function closeLetter() {
      modal.classList.remove('active');
    }

    function closeOnBackdrop(e) {
      if (e.target === modal) {
        closeLetter();
      }
    }

    // Desbloqueo al primer toque
    document.addEventListener('click', () => { if (!isPlaying) playMusic(); }, { once: true });
    document.addEventListener('touchstart', () => { if (!isPlaying) playMusic(); }, { once: true });
  </script>
</body>
</html>
